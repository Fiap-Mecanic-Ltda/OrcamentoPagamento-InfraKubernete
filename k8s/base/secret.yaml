# ⚠️ Segredos de exemplo — NÃO use estes valores nem comite valores reais neste arquivo.
#
# Documenta as chaves esperadas pelo Deployment. Os dois overlays removem este
# placeholder e o Secret real é criado à parte:
# - overlays/local: scripts/deploy-local.sh, a partir do .env (ver README.md).
# - overlays/prod: o overlay remove este placeholder; o Secret real será criado pela
#   pipeline a partir do SSM Parameter Store (mesmo modelo do InfraKubernete do monólito).
apiVersion: v1
kind: Secret
metadata:
  name: orcamento-secrets
  namespace: orcamento
  labels:
    app.kubernetes.io/part-of: orcamento-pagamento
type: Opaque
stringData:
  SA_PASSWORD: "CHANGE_ME_StrongPassword123!"
  JWT_SECRET_KEY: "CHANGE_ME_jwt_secret_key_min_32_characters"
  ConnectionStrings__DefaultConnection: "Server=orcamento-sqlserver;Database=MechanicOrcamentoDb;User Id=sa;Password=CHANGE_ME_StrongPassword123!;TrustServerCertificate=True;"
  # Opcionais (o Deployment trata como optional). Vazios = sem Saga / gateway fake /
  # webhook sem validação de assinatura.
  RabbitMq__Usuario: "CHANGE_ME_rabbitmq_user"
  RabbitMq__Senha: "CHANGE_ME_rabbitmq_password"
  MERCADOPAGO_ACCESS_TOKEN: ""
  MERCADOPAGO_WEBHOOK_SECRET: ""
  MERCADOPAGO_NOTIFICATION_URL: ""
