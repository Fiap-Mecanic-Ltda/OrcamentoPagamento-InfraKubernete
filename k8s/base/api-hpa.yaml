# Requer o metrics-server no cluster (o k3s já traz).
#
# Várias réplicas são seguras para este serviço: as migrations do EF Core usam
# sp_getapplock (só uma réplica migra por vez), não há seed, e as filas da Saga no RabbitMQ
# entregam cada mensagem a uma réplica só (consumidores concorrentes na mesma fila).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orcamento-api
  namespace: orcamento
  labels:
    app.kubernetes.io/part-of: orcamento-pagamento
    app.kubernetes.io/name: orcamento-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orcamento-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Sem métrica de memória: o consumo do .NET em repouso já fica perto de 80%
    # do request e não cai quando há mais pods, então o HPA nunca voltava a 1.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    # O pico de CPU do .NET na subida de um pod (JIT, migrations) disparava o
    # HPA durante o rollout e enchia os nos t3.small de pods até faltar memória.
    # A janela ignora o pico de partida e a política sobe no máximo 1 pod por minuto.
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
