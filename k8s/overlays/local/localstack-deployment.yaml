# SNS e SQS locais (LocalStack), no lugar da AWS. O script montado em init/ready.d cria
# a mesma topologia que o Terraform vai criar na AWS: tópicos, fila e DLQ.
# Sem volume: a topologia é recriada pelo script a cada subida do pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcamento-localstack
  namespace: orcamento
  labels:
    app.kubernetes.io/part-of: orcamento-pagamento
    app.kubernetes.io/name: orcamento-localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orcamento-localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orcamento-localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4566
              name: edge
          env:
            - name: SERVICES
              value: "sns,sqs"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: DEBUG
              value: "0"
          volumeMounts:
            - name: init
              mountPath: /etc/localstack/init/ready.d
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          # Pronto só depois que o script de init terminou: antes disso a fila que a API
          # consome ainda não existe.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -s localhost:4566/_localstack/init/ready | grep -Eq '"completed":[[:space:]]*true'
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
      volumes:
        - name: init
          configMap:
            name: orcamento-localstack-init
            defaultMode: 0755
