apiVersion: v1
kind: Service
metadata:
  name: orcamento-rabbitmq
  namespace: orcamento
  labels:
    app.kubernetes.io/part-of: orcamento-pagamento
    app.kubernetes.io/name: orcamento-rabbitmq
spec:
  selector:
    app.kubernetes.io/name: orcamento-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: gestao
      port: 15672
      targetPort: gestao
