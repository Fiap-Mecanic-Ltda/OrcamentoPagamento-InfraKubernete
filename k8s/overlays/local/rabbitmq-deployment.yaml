# RabbitMQ só do overlay local, no papel do RabbitMQ do namespace "mensageria" que o
# InfraKubernete instala no cluster de produção. Sem disco: as filas somem com o pod, o
# que basta para desenvolver. Usuário e senha vêm do Secret orcamento-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcamento-rabbitmq
  namespace: orcamento
  labels:
    app.kubernetes.io/part-of: orcamento-pagamento
    app.kubernetes.io/name: orcamento-rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orcamento-rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orcamento-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: gestao
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: orcamento-secrets
                  key: RabbitMq__Usuario
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: orcamento-secrets
                  key: RabbitMq__Senha
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
