apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orcamento

# Desenvolvimento local (k3s em Docker, kind, minikube): além da base, sobe o banco e a
# mensageria como pods, no papel que o docker-compose cumpre fora do cluster.
resources:
  - ../../base
  - sqlserver-pvc.yaml
  - sqlserver-deployment.yaml
  - sqlserver-service.yaml
  - localstack-deployment.yaml
  - localstack-service.yaml

# Script de topologia do LocalStack. Cópia de scripts/localstack do
# OrcamentoPagamento-service: kustomize não lê arquivos fora da pasta do overlay.
configMapGenerator:
  - name: orcamento-localstack-init
    files:
      - localstack/01-criar-topico-e-fila.sh

patches:
  # Remove o Secret placeholder da base: o real é criado por scripts/deploy-local.sh a
  # partir do .env. Se o placeholder fosse aplicado, sobrescreveria as senhas reais.
  - target:
      kind: Secret
      name: orcamento-secrets
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: orcamento-secrets
        namespace: orcamento

  # Mensageria ligada e apontada para o LocalStack do cluster. Mesmos nomes/ARNs que o
  # script de init cria.
  - target:
      kind: ConfigMap
      name: orcamento-config
    patch: |-
      - op: add
        path: /data/Messaging__Habilitado
        value: "true"
      - op: add
        path: /data/Messaging__ServiceUrl
        value: "http://orcamento-localstack:4566"
      - op: add
        path: /data/Messaging__TopicoEventosArn
        value: "arn:aws:sns:us-east-1:000000000000:orcamento-eventos"
      - op: add
        path: /data/Messaging__FilaItensAlteradosUrl
        value: "http://orcamento-localstack:4566/000000000000/ordem-servico-itens-alterados"
      - op: add
        path: /data/ASPNETCORE_ENVIRONMENT
        value: "Development"

  # A API espera banco e mensageria antes de subir (o initContainer só existe aqui: em
  # produção RDS e SNS/SQS já existem antes do deploy). O SDK da AWS exige credenciais
  # mesmo contra o LocalStack, que aceita qualquer valor.
  - target:
      kind: Deployment
      name: orcamento-api
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: aguarda-sqlserver
            image: busybox:1.36
            command:
              - sh
              - -c
              - until nc -z -w2 orcamento-sqlserver 1433; do echo "aguardando sqlserver..."; sleep 2; done
          - name: aguarda-localstack
            image: busybox:1.36
            command:
              - sh
              - -c
              - until wget -q -T2 -O- http://orcamento-localstack:4566/_localstack/init/ready | grep -Eq '"completed":[[:space:]]*true'; do echo "aguardando localstack..."; sleep 2; done
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_ACCESS_KEY_ID
          value: test
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_SECRET_ACCESS_KEY
          value: test
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_DEFAULT_REGION
          value: us-east-1
