apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orcamento

# Desenvolvimento local (k3s em Docker, kind, minikube): além da base, sobe o banco e o
# RabbitMQ como pods, no papel que o docker-compose cumpre fora do cluster.
resources:
  - ../../base
  - sqlserver-pvc.yaml
  - sqlserver-deployment.yaml
  - sqlserver-service.yaml
  - rabbitmq-deployment.yaml
  - rabbitmq-service.yaml

patches:
  # Remove o Secret placeholder da base: o real é criado por scripts/deploy-local.sh a
  # partir do .env. Se o placeholder fosse aplicado, sobrescreveria as senhas reais.
  - target:
      kind: Secret
      name: orcamento-secrets
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: orcamento-secrets
        namespace: orcamento

  # Saga ligada e apontada para o RabbitMQ do overlay. Para testar com o OS Service no
  # mesmo cluster, aponte RabbitMq__Host para o RabbitMQ que ele usa.
  - target:
      kind: ConfigMap
      name: orcamento-config
    patch: |-
      - op: replace
        path: /data/Mensageria__Habilitada
        value: "true"
      - op: replace
        path: /data/RabbitMq__Host
        value: "orcamento-rabbitmq"
      - op: add
        path: /data/ASPNETCORE_ENVIRONMENT
        value: "Development"

  # A API espera banco e RabbitMQ antes de subir (o initContainer só existe aqui: em
  # produção o RDS e o RabbitMQ do cluster já existem antes do deploy).
  - target:
      kind: Deployment
      name: orcamento-api
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: aguarda-sqlserver
            image: busybox:1.36
            command:
              - sh
              - -c
              - until nc -z -w2 orcamento-sqlserver 1433; do echo "aguardando sqlserver..."; sleep 2; done
          - name: aguarda-rabbitmq
            image: busybox:1.36
            command:
              - sh
              - -c
              - until nc -z -w2 orcamento-rabbitmq 5672; do echo "aguardando rabbitmq..."; sleep 2; done
